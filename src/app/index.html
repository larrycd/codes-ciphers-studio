<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codes &amp; Ciphers Studio</title>
<link rel="icon" href="icon.svg">
<style>
:root { --bg:#0e1112; --panel:#161b1c; --panel2:#1e2526; --line:#2c3638; --text:#edf0ee; --dim:#97a3a0; --acc:#c9a227; --acc2:#e8c766; --grn:#4fb38a; --ok:#5fb37f; --warn:#d9a441; --bad:#e0605a; --hi:#ffd75e; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 "Segoe UI", system-ui, sans-serif; }
header { display:flex; align-items:center; gap:14px; padding:10px 18px; border-bottom:1px solid var(--line); background:linear-gradient(90deg,#1d2410,#0e1112 60%); }
header .mark { width:40px; height:40px; }
header h1 { margin:0; font:600 21px Georgia, serif; letter-spacing:.4px; }
header .by { color:var(--dim); font-size:12.5px; }
header .sp { flex:1; }
header .ver { color:var(--dim); font-size:12px; text-align:right; }
.wrap { display:grid; grid-template-columns:150px 1fr; min-height:calc(100vh - 62px); }
nav.main { border-right:1px solid var(--line); padding:12px 8px; background:#121617; }
nav.main button { display:block; width:100%; text-align:left; background:transparent; color:var(--dim); border:1px solid transparent; border-radius:8px; padding:8px 10px; margin-bottom:4px; cursor:pointer; font-size:14px; }
nav.main button.on { color:#fff; background:#26240f; border-color:#5f5418; }
.view { display:none; padding:14px 16px; } .view.on { display:block; }
.lib { display:grid; grid-template-columns:270px 1fr; gap:14px; align-items:start; }
.list { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px; max-height:calc(100vh - 100px); overflow:auto; position:sticky; top:10px; }
.list input { margin-bottom:6px; }
.list .ch { color:var(--acc2); font-size:11px; text-transform:uppercase; letter-spacing:1px; margin:10px 6px 4px; }
.list button { display:flex; gap:6px; align-items:center; width:100%; text-align:left; background:transparent; color:var(--text); border:0; border-radius:6px; padding:5px 8px; cursor:pointer; font-size:13px; }
.list button:hover { background:var(--panel2); } .list button.on { background:#2b2a14; color:var(--hi); }
.list button .m { margin-left:auto; font-size:10px; color:var(--grn); border:1px solid #2c5a47; border-radius:9px; padding:0 5px; }
section { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; min-width:0; margin-bottom:14px; }
h2 { margin:0 0 6px; font:600 19px Georgia, serif; color:var(--acc2); }
h3 { margin:14px 0 6px; font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--dim); }
.about { color:#cdd5d2; margin:0 0 10px; }
textarea { width:100%; min-height:84px; resize:vertical; background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:9px; font:16px/1.5 Consolas, "Segoe UI Symbol", monospace; }
input[type=text], input[type=search], input[type=number] { width:100%; background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:7px; padding:7px 9px; font:14px Consolas, monospace; }
select { background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:7px; padding:6px 8px; font-size:13px; max-width:100%; }
.keys { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:8px 12px; margin:8px 0; }
.keys label { display:block; font-size:12px; color:var(--dim); } .keys .wide { grid-column:1 / -1; }
.row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:8px 0; }
button.b { background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:7px; padding:6px 11px; cursor:pointer; font-size:13px; }
button.b:hover { border-color:var(--acc); } button.b:disabled { opacity:.4; cursor:default; }
button.p { background:var(--acc); border-color:var(--acc); color:#111; font-weight:700; }
.out { font:17px/1.6 Consolas, "Segoe UI Symbol", monospace; background:#0b0f0f; border:1px solid var(--line); border-radius:8px; padding:9px 11px; word-break:break-all; white-space:pre-wrap; min-height:44px; }
.hint { color:var(--dim); font-size:12px; }
.note { font-size:12.5px; color:#cdd5d2; border-left:3px solid var(--acc); padding:5px 9px; margin:8px 0; background:#1b1d12; }
.err { color:var(--bad); }
.obj { background:#0b0f0f; border:1px solid var(--line); border-radius:10px; padding:10px; margin-bottom:10px; overflow:auto; }
.obj svg { display:block; margin:0 auto; max-width:100%; height:auto; user-select:none; }
.obj .ctl { display:flex; gap:8px; flex-wrap:wrap; align-items:center; justify-content:center; margin-top:8px; }
.step { font:14px Consolas, monospace; color:var(--hi); text-align:center; min-height:22px; margin-top:6px; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th, td { text-align:left; padding:5px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
th { color:var(--dim); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.8px; }
.badge { display:inline-flex; gap:6px; align-items:center; font-size:12px; padding:3px 9px; border-radius:999px; border:1px solid var(--line); }
.badge.ok { color:var(--ok); border-color:#2f5a40; } .badge.bad { color:var(--bad); border-color:#5a2a31; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.bars { display:flex; align-items:flex-end; gap:3px; height:150px; padding-top:8px; }
.bars div { flex:1; background:var(--grn); position:relative; min-width:8px; border-radius:2px 2px 0 0; }
.bars div i { position:absolute; bottom:-18px; left:0; right:0; text-align:center; font-style:normal; font-size:11px; color:var(--dim); }
.bars div b { position:absolute; left:15%; right:15%; border-top:2px dashed var(--acc); }
.card { background:var(--panel2); border:1px solid var(--line); border-radius:9px; padding:12px; margin-bottom:10px; }
.card h4 { margin:0 0 4px; font-size:15px; color:var(--acc2); }
.status { font-size:11px; padding:1px 8px; border-radius:9px; border:1px solid var(--line); margin-left:6px; }
.status.solved { color:var(--ok); border-color:#2f5a40; } .status.unsolved { color:var(--bad); border-color:#5a2a31; } .status.partial { color:var(--warn); border-color:#5d4a26; }
.kbd { display:inline-grid; gap:4px; }
.kbd .r { display:flex; gap:4px; justify-content:center; }
.lamp, .key { width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font:600 13px Consolas, monospace; }
.lamp { background:#1b1f1f; color:#555; border:1px solid #333; }
.lamp.on { background:#ffd75e; color:#211; box-shadow:0 0 14px #ffd75e; }
.key { background:#262b2b; color:#ddd; border:2px solid #444; cursor:pointer; }
.key:active, .key.down { background:#3b4140; transform:translateY(1px); }
.bacon-b { font-family:Georgia, serif; font-style:italic; font-weight:700; color:#f0d27a; }
.bacon-a { font-family:"Segoe UI", sans-serif; }
@media (max-width:1050px) { .lib { grid-template-columns:1fr; } .list { position:static; max-height:300px; } .wrap { grid-template-columns:1fr; } nav.main { display:flex; flex-wrap:wrap; gap:4px; } nav.main button { width:auto; } .grid2 { grid-template-columns:1fr; } }
@media print { header, nav, .list, .noprint { display:none !important; } body { background:#fff; color:#000; } .view.on { display:block; } section, .obj { border:0; background:#fff; } }
</style>
</head>
<body>
<header>
  <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="#2b2a14" stroke="#c9a227" stroke-width="3"/><circle cx="32" cy="32" r="19" fill="#161b1c" stroke="#e8c766" stroke-width="2"/><g fill="#e8c766" font-family="Georgia" font-size="9" text-anchor="middle"><text x="32" y="11">A</text><text x="53" y="35">D</text><text x="32" y="59">G</text><text x="11" y="35">J</text></g><g fill="#4fb38a" font-family="Georgia" font-size="11" text-anchor="middle"><text x="32" y="22">X</text><text x="42" y="36">A</text><text x="32" y="49">D</text><text x="22" y="36">G</text></g><circle cx="32" cy="32" r="3" fill="#c9a227"/></svg>
  <div><h1>Codes &amp; Ciphers Studio</h1><div class="by">by Larry Dalton &middot; working models of the codes and ciphers in Sunil Tanna's <i>Codes, Ciphers, Steganography &amp; Secret Messages</i></div></div>
  <div class="sp"></div>
  <div class="ver" id="ver"></div>
</header>
<div class="wrap">
  <nav class="main">
    <button data-v="lib" class="on">Ciphers</button>
    <button data-v="break">Codebreaker</button>
    <button data-v="chal">Famous &amp; challenges</button>
    <button data-v="test">Self-test</button>
    <button data-v="about">About</button>
  </nav>
  <main>
    <div class="view on" id="v-lib">
      <div class="lib">
        <div class="list" id="list"><input type="search" id="find" placeholder="Find a cipher..."></div>
        <div id="work"></div>
      </div>
    </div>
    <div class="view" id="v-break"></div>
    <div class="view" id="v-chal"></div>
    <div class="view" id="v-test"></div>
    <div class="view" id="v-about"></div>
  </main>
</div>
<script src="js/core.js"></script>
<script src="js/trans.js"></script>
<script src="js/poly.js"></script>
<script src="js/misc.js"></script>
<script src="js/objects.js"></script>
<script src="js/objects2.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
